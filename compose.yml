services:
  pg:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    container_name: pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventramed
    networks:
      - inventramed

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    # The built-in guest user can only connect from localhost, so the Pi needs its own user.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-inventramed}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-inventramed}
    networks:
      - inventramed
    ports:
      - 5672:5672
      - 15672:15672

networks:
  inventramed:
    name: inventramed
